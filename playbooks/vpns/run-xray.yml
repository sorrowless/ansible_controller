#!/usr/bin/env -S ansible-playbook
#
# Playbook to install and run xray on target nodes.
# Modes (mutually exclusive for local vs swarm):
#   - xray_local_install: true  → official install-release.sh + systemd
#   - xray_swarm_deploy defined → Docker Swarm
#   - otherwise                 → docker compose
#
# > ./run-xray.yml

---
- name: Configure target servers
  hosts: xray
  become: yes
  become_user: root
  vars:
    image_name: "{{ xray_image_name | default('ghcr.io/xtls/xray-core') }}:{{ xray_version | default('26.3.27') }}"
    networks:
      default:
        name: "{{ xray_network_name | default('prom_network')}}"
        external: True

  tasks:
    - name: Check xray configuration is defined
      ansible.builtin.assert:
        that:
          - xray_conf is defined
        fail_msg: "Variable 'xray_conf' is undefined!"

    - name: Check local and swarm modes are mutually exclusive
      ansible.builtin.assert:
        that:
          - not ((xray_local_install | default(false) | bool) and (xray_swarm_deploy is defined))
        fail_msg: "Set either xray_local_install or xray_swarm_deploy, not both."

    - name: Install Xray locally via official script
      when:
        - xray_local_install | default(false) | bool
      block:
        - name: Remove Xray docker compose when switching to local
          community.docker.docker_compose_v2:
            state: absent
            project_name: xray
            definition:
              services:
                xray:
                  image: "{{ image_name }}"
                  container_name: "{{ xray_container_name | default('xray') }}"
          failed_when: false

        - name: Remove Xray swarm stack when switching to local
          community.docker.docker_stack:
            state: absent
            name: "{{ xray_container_name | default('xray') }}"
          failed_when: false

        - name: Ensure curl for Xray installer
          ansible.builtin.package:
            name: curl
            state: present

        - name: Download official Xray install script
          ansible.builtin.get_url:
            url: https://github.com/XTLS/Xray-install/raw/main/install-release.sh
            dest: /tmp/xray-install-release.sh
            mode: "0755"

        - name: Install Xray via official script
          ansible.builtin.command:
            argv: "{{ ['bash', '/tmp/xray-install-release.sh', 'install'] + (['--version', xray_version] if xray_version is defined else []) }}"
          register: xray_install
          changed_when: >-
            'Installing' in xray_install.stdout
            or 'installed:' in xray_install.stdout

        - name: Ensure Xray config directory (official path)
          ansible.builtin.file:
            path: "{{ xray_conf_dir | default('/usr/local/etc/xray') }}"
            state: directory
            mode: "0755"
            owner: root
            group: root

        - name: Ensure Xray config.json
          ansible.builtin.copy:
            dest: "{{ xray_conf_dir | default('/usr/local/etc/xray') }}/config.json"
            content: "{{ xray_conf | to_nice_json(indent=2) }}"
            mode: "0644"
          register: xray_local_confile

        - name: Enable and restart Xray systemd service
          ansible.builtin.systemd:
            name: xray
            enabled: true
            state: restarted
            daemon_reload: true
          when: xray_install.changed or xray_local_confile.changed

    - name: Remove local Xray when switching to docker or swarm
      when:
        - not (xray_local_install | default(false) | bool)
      block:
        - name: Check for local Xray binary
          ansible.builtin.stat:
            path: /usr/local/bin/xray
          register: xray_local_bin

        - name: Ensure curl for Xray remover
          ansible.builtin.package:
            name: curl
            state: present
          when: xray_local_bin.stat.exists

        - name: Download official Xray install script for remove
          ansible.builtin.get_url:
            url: https://github.com/XTLS/Xray-install/raw/main/install-release.sh
            dest: /tmp/xray-install-release.sh
            mode: "0755"
          when: xray_local_bin.stat.exists

        - name: Remove local Xray via official script
          ansible.builtin.command:
            argv:
              - bash
              - /tmp/xray-install-release.sh
              - remove
              - --purge
          when: xray_local_bin.stat.exists
          register: xray_remove
          changed_when: "'removed:' in xray_remove.stdout"

    - name: Ensure xray config directory
      ansible.builtin.file:
        dest: "{{ xray_conf_dir | default('/etc/xray') }}"
        state: directory
        mode: "0755"
        owner: root
        group: root
      when:
        - not (xray_local_install | default(false) | bool)
      tags: test

    - name: Ensure xray config file
      ansible.builtin.copy:
        dest: "{{ xray_conf_dir | default('/etc/xray') }}/config.yml"
        content: "{{ xray_conf | to_nice_yaml(indent=2) }}"
      register: confile
      when:
        - not (xray_local_install | default(false) | bool)
        - xray_swarm_deploy is not defined
      tags: test

    - name: Ensure xray networks
      ansible.builtin.set_fact:
        networks: "{{ xray_networks }}"
      when:
        - not (xray_local_install | default(false) | bool)
        - xray_networks is defined

    - name: Start xray container
      community.docker.docker_compose_v2:
        state: present
        project_name: xray
        definition:
          services:
            xray:
              image: "{{ image_name }}"
              container_name: "{{ xray_container_name | default('xray') }}"
              hostname: xray
              volumes:
                - "{{ xray_conf_dir | default('/etc/xray') }}/config.yml:/etc/xray/config.yml:ro"
              restart: unless-stopped
              ports: "{{ xray_ports | default([]) }}"
              command: run -config /etc/xray/config.yml
              networks: "{{ networks.keys() | list }}"
          networks: "{{ networks }}"
      when:
        - not (xray_local_install | default(false) | bool)
        - xray_swarm_deploy is not defined

    - name: Deploy xray service in swarm
      when:
        - not (xray_local_install | default(false) | bool)
        - xray_swarm_deploy is defined
      block:
        - name: Ensure pip installation
          package:
            name: "python3-pip"
            state: present

        - name: Install newer version of pip itself
          pip:
            name: "pip"
            state: latest
            executable: pip3
          when:
            - ansible_distribution == "ubuntu"
            - ansible_distribution_major_version != 24

        - name: Install jsondiff from pip
          pip:
            name: "jsondiff"
            state: present
            executable: pip3
          when:
            - ansible_distribution == "ubuntu"
            - ansible_distribution_major_version != 24

        - name: Ensure jsondiff
          package:
            name: "python3-jsondiff"
            state: present
          when:
            - ansible_distribution == "ubuntu"
            - ansible_distribution_major_version == 24

        - name: Check if config-file has changes
          community.docker.docker_config:
            name: xray-config
            data: "{{ xray_conf | to_nice_yaml(indent=2) }}"
          check_mode: yes
          register: config_changes
          run_once: True

        - name: Delete service
          community.docker.docker_swarm_service:
            state: absent
            name: "{{ xray_container_name | default('xray') }}_xray"
          run_once: True
          when: config_changes.changed

        - name: Update config
          community.docker.docker_config:
            name: xray-config
            data: "{{ xray_conf | to_nice_yaml(indent=2) }}"
            state: present
          run_once: True
          when: config_changes.changed

        - name: Deploy xray container in swarm
          community.docker.docker_stack:
            state: present
            name: "{{ xray_container_name | default('xray') }}"
            with_registry_auth: True
            compose:
              - services:
                  xray:
                    image: "{{ image_name }}"
                    configs:
                      - source: xray-config
                        target: "/etc/xray/config.yml"
                    ports: "{{ xray_ports | default ([]) }}"
                    command: run -config /etc/xray/config.yml
                    deploy: "{{ xray_swarm_deploy }}"
                    networks: "{{ networks.keys() | list }}"
                configs:
                  xray-config:
                    external: True
                networks: "{{ networks }}"
          run_once: True
