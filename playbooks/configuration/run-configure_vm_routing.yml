#!/usr/bin/env -S ansible-playbook -e @vars/extra.yaml
#
# Run it like usual executable script:
# > ./run-configure_vm_routing.yml
#
---
- name: Автоматическая настройка PBR и немецкого маршрута на ВМ
  hosts: german_nic
  become: true
  gather_facts: true

  vars:
    ru_iface: "ens3"
    de_iface: "ens4"

  tasks:
    # 1. Расчет немецкого IP (wx.001 -> 10.99.0.11) и сбор IP/GW для РФ сети
    - name: 1. Расчет IP-адресов и шлюзов
      ansible.builtin.set_fact:
        de_static_ip: "10.99.0.{{ 10 + (inventory_hostname | regex_search('\\d+$') | int) }}"
        ru_ip: "{{ ansible_ens3.ipv4.address | default(ansible_default_ipv4.address) }}"
        ru_gw: "{{ ansible_ens3.ipv4.gateway | default(ansible_default_ipv4.gateway) }}"

    # 2. Удаление устаревших и дублирующих файлов Netplan
    - name: 2. Очистка старых файлов Netplan
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/etc/netplan/99-ens3-static.yaml"
        - "/etc/netplan/99-ens3-dhcp.yaml"
        - "/etc/netplan/99-ens4-dhcp.yaml"
        - "/etc/netplan/99-ens4-static.yaml"
        - "/etc/netplan/90-override-ens3.yaml"

    # 3. Конфиг Netplan с PBR для ens3 и дефолтным маршрутом для ens4
    - name: 3. Создание единой конфигурации Netplan (РФ PBR + Германия)
      ansible.builtin.copy:
        dest: "/etc/netplan/99-german-routing.yaml"
        owner: root
        group: root
        mode: '0600'
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              {{ ru_iface }}:
                routes:
                  - to: default
                    via: {{ ru_gw }}
                    table: 100
                routing-policy:
                  - from: {{ ru_ip }}
                    table: 100
              {{ de_iface }}:
                dhcp4: false
                dhcp6: false
                addresses:
                  - {{ de_static_ip }}/24
                routes:
                  - to: default
                    via: {{ vm_private_gateway | default('10.99.0.1') }}
                    metric: 100
                nameservers:
                  addresses:
                    - 1.1.1.1
                    - 1.0.0.1
                    - 77.88.8.8

    # 4. Применение Netplan
    - name: 4. Применение Netplan
      ansible.builtin.command:
        cmd: "netplan apply"

    # 5. Принудительное удаление старого дефолтного маршрута РФ из таблицы main
    - name: 5. Удаление дефолтного маршрута РФ из основной таблицы
      ansible.builtin.command:
        cmd: "ip route del default dev {{ ru_iface }}"
      failed_when: false

    # 6. Контрольная проверка внешнего IP
    - name: 6. Проверка внешнего немецкого IP
      ansible.builtin.shell:
        cmd: "curl -s -4 --connect-timeout 5 checkip.amazonaws.com"
      register: external_ip_check
      changed_when: false
      when: not ansible_check_mode

    # 7. Вывод результата
    - name: 7. Итоговый статус
      ansible.builtin.debug:
        msg: "Успех! {{ inventory_hostname }} (Германия {{ de_static_ip }}) -> Внешний немецкий IP: {{ external_ip_check.stdout | trim }}"
      when: not ansible_check_mode
