#!/usr/bin/env -S ansible-playbook -e @vars/extra.yaml
#
# Run it like usual executable script:
#
# > ./run-configure_vm_routing.yml
#
---
- name: Автоматическая настройка PBR и немецкого маршрута на ВМ
  hosts: german_nic
  become: true
  gather_facts: true

  tasks:
    # 1. Безопасно вытягиваем IP-адрес интерфейса ens3 из фактов Ansible
    - name: 1. Получение статического IP интерфейса ens3
      ansible.builtin.set_fact:
        ru_ip: "{{ ansible_facts['ens3']['ipv4']['address'] }}"
        ru_iface: "ens3"
      when: ansible_facts['ens3'] is defined

    # 2. Динамически парсим Netplan, чтобы найти шлюз, даже если он уже удален из runtime-таблицы
    - name: 2. Поиск русского шлюза в конфигурационных файлах Netplan
      ansible.builtin.shell:
        cmd: "grep -E 'via|gateway' /etc/netplan/*.yaml | head -n 1 | grep -oE '[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+'"
      register: netplan_gateway_search
      changed_when: false

    - name: 3. Сохранение полученного русского шлюза
      ansible.builtin.set_fact:
        ru_gw: "{{ netplan_gateway_search.stdout | trim }}"

    - name: 4. Вывод обнаруженных данных для проверки безопасности
      ansible.builtin.debug:
        msg: "Обнаружено на ВМ: Интерфейс={{ ru_iface }}, IP={{ ru_ip }}, Шлюз={{ ru_gw }}"

    # 3. Настраиваем PBR на ВМ (сначала страхуем входящие соединения)
    - name: 5. Добавление русского шлюза в кастомную таблицу 100
      ansible.builtin.command:
        cmd: "ip route add default via {{ ru_gw }} dev {{ ru_iface }} table 100"
      failed_when: false

    - name: 6. Добавление правила политики маршрутизации для русского IP
      ansible.builtin.command:
        cmd: "ip rule add from {{ ru_ip }} table 100"
      failed_when: false

    # 4. Настраиваем постоянный Netplan для ens8 (Германия)
    - name: 7. Создание перманентного Netplan-конфига для DHCP на ens8
      ansible.builtin.copy:
        dest: /etc/netplan/99-ens8-dhcp.yaml
        owner: root
        group: root
        mode: '0600'
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              ens8:
                dhcp4: true
                dhcp4-overrides:
                  route-metric: 100

    - name: 8. Применение конфигурации Netplan
      ansible.builtin.command:
        cmd: "netplan apply"

    # 5. Переключаем глобальный дефолтный шлюз
    - name: 9. Удаление дефолтного русского шлюза из основной таблицы
      ansible.builtin.command:
        cmd: "ip route del default via {{ ru_gw }} dev {{ ru_iface }}"
      failed_when: false

    # 6. Валидация работы
    - name: 10. Пауза 5 секунд для получения IP по DHCP
      ansible.builtin.pause:
        seconds: 5
      when: not ansible_check_mode

    - name: 11. Проверка внешнего IP (запрос идет уже через Германию)
      ansible.builtin.uri:
        url: http://ifconfig.co
        headers:
          Accept: "application/json"
        return_content: true
      register: external_ip_check
      when: not ansible_check_mode

    - name: 12. Вывод проверенного внешнего IP
      ansible.builtin.debug:
        msg: "Успех! Внешний IP виртуалки теперь: {{ external_ip_check.json.ip }}"
      when: not ansible_check_mode
