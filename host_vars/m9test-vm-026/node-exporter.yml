# Переменные для роли node_exporter
node_exporter_version: '1.4.0'
node_exporter_run_in_docker: true
node_exporter_host_address: 0.0.0.0
node_exporter_stack_name: node_exporter
node_exporter_swarm_cluster: false
node_exporter_docker_network_name: prom_network

node_exporter_docker_labels:
  - "traefik.enable=test"
  - "traefik.swarm.network=test"
  - "traefik.http.routers.xray-checker-rus.rule=test"
  - "traefik.http.routers.xray-checker-rus.middlewares=test"
  - "traefik.http.routers.xray-checker-rus.tls=test"
  - "traefik.http.routers.xray-checker-rus.tls.certResolver=test"
  - "traefik.http.services.xray-checker-rus.loadbalancer.server.port=test"
