# 1. Флаг очистки старого файл-провиженинга (read-only)
grafana_cleanup_old_provisioning: true

# 2. Включение GitSync
grafana_gitsync_enabled: true

# 3. Настройки Git-репозитория
grafana_dashboards_repo_url: "https://github.com/Jony321/grafana-dashboards.git"
# Укажите "main" или "feature/gitsync-migration", если тестируете в ветке!
grafana_dashboards_repo_version: "feature/gitsync-migration"
grafana_dashboards_repo_path: "dashboards"

# 4. Токен, который вы сгенерировали в GitHub
grafana_gitsync_token: "{{ vault_grafana_dashboards_repo_token}}"
grafana_provisioning_dashboards: ["*exporter*", "xray*"]
