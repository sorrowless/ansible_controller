---
xray_checker_configurations:
  - stack_name: 'xray-checker-nld'
    image: "kutovoys/xray-checker:latest"
    envvars:
      SUBSCRIPTION_URL: "{{ vault_checker.nld }}"
    docker_network_name: 'prom_network'
    swarm_manager_name: 'monitor.openworld.bot'
    swarm_deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: []
      labels:
        - "traefik.enable=true"
        # Change network name here accordingly
        - "traefik.swarm.network=prom_network"
        # Ensure proper host name here
        - "traefik.http.routers.xray-checker-nld.rule=Host(`nld.checker.openworld.bot`)"
        - "traefik.http.routers.xray-checker-nld.middlewares=basic-auth@file"
        - "traefik.http.routers.xray-checker-nld.tls=true"
        - "traefik.http.routers.xray-checker-nld.tls.certResolver=acmeDNS"
        - "traefik.http.services.xray-checker-nld.loadbalancer.server.port=2112"
