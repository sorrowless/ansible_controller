---
node_exporter_version: '1.4.0'
node_exporter_docker_image: "prom/node-exporter:v{{ node_exporter_version }}"
node_exporter_run_in_docker: true
node_exporter_container_name: "{{ ansible_ip }}"

node_exporter_host_address: 0.0.0.0
node_exporter_stack_name: victoriametrics
node_exporter_swarm_cluster: true
node_exporter_swarm_manager: monitor.openworld.bot
node_exporter_docker_network_name: prom_network
node_exporter_swarm_deploy:
  mode: global
  placement:
    constraints: []