---
grafana_web_host: grafana.openworld.bot
grafana:
  admin_user: admin
  admin_password: "{{ vault_grafana_admin_password }}"
grafana_docker_network_name: prom_network
grafana_url: "https://{{ grafana_web_host }}"

grafana_datasources:
  - name: VictoriaMetrics
    url: http://{{ vmselect_container_name }}:8481/select/0/prometheus
    type: prometheus
    access: proxy
    isDefault: true

# GitSync Configuration
grafana_cleanup_old_provisioning: true
grafana_gitsync_enabled: true

# Source repository
grafana_dashboards_repo_url: "https://github.com/oom-ag/grafana-dashboards"
grafana_dashboards_repo_version: "main"
grafana_gitsync_token: "{{ vault_grafana_dashboards_repo_token }}"

grafana_sync_dashboards:
  - "alertmanager"
  - "common-hosts-info"
  - "hosts-availability-v2"
  - "mtproxy-sessions"
  - "node-exporter-dashboard"
  - "node-exporter-summary"
  - "victoriametrics"
  - "victoriametrics-summary"
  - "vmagent"
  - "vmalert"
  - "xray-logs-data"

grafana_ports: []
grafana_stack_name: victoriametrics
grafana_swarm_cluster: true
grafana_swarm_manager: monitor.openworld.bot
grafana_swarm_deploy:
  mode: replicated
  replicas: 1
  placement:
    constraints: []
  labels:
    - "traefik.enable=true"
    - "traefik.swarm.network={{ grafana_docker_network_name }}"
    - "traefik.http.routers.grafana.rule=Host(`{{ grafana_web_host }}`)"
    - "traefik.http.routers.grafana.tls=true"
    - "traefik.http.routers.grafana.tls.certResolver=acmeDNS"
    - "traefik.http.services.grafana.loadbalancer.server.port=3000"
