---
vmstorage_container_name: vmstorage
vmstorage_docker_image: "victoriametrics/vmstorage:v1.113.0-cluster"
vmstorage_docker_network_name: prom_network
vmstorage_command:
- '-storageDataPath=/storage'
- '-retentionPeriod=1d'
- '-dedup.minScrapeInterval=30s'
- '-search.maxUniqueTimeseries=10000000'
- '-search.maxConcurrentRequests=48'

vmstorage_ports:
- target: 8401
  published: 8401
  protocol: tcp
  mode: host
vmstorage_stack_name: victoriametrics
vmstorage_swarm_cluster: true
vmstorage_web_host: deu05.vmstorage.openworld.bot
vm_swarm_manager: "{{ ansible_domainname }}"
vmstorage_swarm_deploy:
  mode: replicated
  replicas: 1
  placement:
    constraints: []
