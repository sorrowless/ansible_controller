---
# Iptables rules
iptables:
  default_allowed_tcp_ports: [22, 80, 443]
  raw_rules:
    - "-A INPUT -s 10.10.10.0/24 -j ACCEPT -m comment --comment 'docker-prom_network'"
    - "-A INPUT -p tcp --dport 8401 -s {{ hostvars['monitor.openworld.bot'].ansible_ip }} -j ACCEPT -m comment --comment 'allow-central-monitor-to-vmstorage'"
    - "-A INPUT -p tcp --dport 8401 -j DROP -m comment --comment 'drop-all-other-to-vmstorage'"
    - "-A INPUT -p tcp --dport 8481 -s {{ hostvars['monitor.openworld.bot'].ansible_ip }} -j ACCEPT -m comment --comment 'allow-central-monitor-to-vmselect'"
    - "-A INPUT -p tcp --dport 8481 -j DROP -m comment --comment 'drop-all-other-to-vmselect'"
