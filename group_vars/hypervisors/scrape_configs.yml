---
sc_monitor_openworld_bot:
  - data:
      - job_name: '{{ ansible_domainname }}-node-exporter'
        scheme: http
        static_configs:
          - labels:
              dns_hostname: '{{ ansible_domainname }}'
              domainname: '{{ domainname | default(ansible_domainname) }}'
              env: production
              ipaddress: '{{ ansible_ip }}'
              project: akh
              scrape_type: node_exporter
              server_type: '{{ server_type | default("hypervisor") }}'
              country: '{{ country | default("") }}'
              provider: '{{ provider | default("") }}'
            targets:
              - '{{ ansible_ip }}:9100'
    filename: '{{ ansible_domainname }}-node-exporter.yml'
